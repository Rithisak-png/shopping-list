<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buying List</title>

    <link rel="stylesheet" href="style.css">
    
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

    <div class="container">

        <h1>🛒 Buying List</h1>

        <div class="form-box">

            <label>Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name">

            <label>Who wants to buy it?</label>
            <input type="text" id="buyer" placeholder="Enter buyer name">

            <label>Quantity</label>
            <input type="number" id="quantity" value="1" min="1">

            <label>Price Each ($)</label>
            <input type="number" id="price" placeholder="Enter price">

            <label>Product Link</label>
            <input type="url" id="link" placeholder="https://...">

            

            <button onclick="addProduct()">+ Add Product</button>

        </div>

        <div class="products-header">

    <h2>Products</h2>

    <select id="sortSelect" onchange="loadProducts()">
        <option value="newest">Newest First</option>
        <option value="az">Name A → Z</option>
        <option value="za">Name Z → A</option>
    </select>
</div>

        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Product</th>
                    <th>Buyer</th>
                    <th>Qty</th>
                    <th>Price Each</th>
                    <th>Total</th>
                    <th>Link</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productTable">
            </tbody>
        </table>

        <h2 class="grand-total">
            Grand Total: $<span id="grandTotal">0.00</span>
        </h2>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
